apiVersion: apps/v1
kind: Deployment
metadata:
  name: policygate
  labels:
    app: policygate
spec:
  replicas: 2
  selector:
    matchLabels:
      app: policygate
  template:
    metadata:
      labels:
        app: policygate
    spec:
      containers:
      - name: policygate
        image: policygate:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql://policygate:secret@postgres:5432/policygate"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5
